name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  boundary-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      postgis: ${{ steps.changes.outputs.postgis }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: changes
        with:
          # PRs: the full PR diff (including forks). Pushes to main: only
          # this push, not all changes since the feature branch diverged.
          base: ${{ github.ref }}
          filters: |
            postgis:
              - 'scripts/sync-state-boundaries.ts'
              - 'scripts/lib.ts'
              - 'scripts/lib/**'
              - 'scripts/__tests__/state-boundaries-postgis.test.ts'
              - 'scripts/__tests__/sync-state-boundaries.test.ts'
              - 'scripts/__tests__/fixtures/**'
              - 'lib/sync/**'
              - 'lib/db/**'
              - 'lib/mod/**'
              - 'drizzle/**'
              - 'drizzle.config.*'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vitest.config.*'
              - '.github/workflows/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint:biome

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test

  state-boundaries-postgis:
    needs: boundary-changes
    # Job-level gating avoids allocating a runner or starting PostGIS when
    # unrelated UI/docs change. Normal CI jobs remain unconditional.
    if: needs.boundary-changes.outputs.postgis == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: boundary_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: boundary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boundary_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify atomic boundary publication and spatial history
        env:
          STATE_BOUNDARIES_TEST_DATABASE_URL: postgresql://postgres:boundary_test@localhost:5432/boundary_test
        run: npx vitest run scripts/__tests__/state-boundaries-postgis.test.ts

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run openapi:check

  db-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run db:check-journal

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
