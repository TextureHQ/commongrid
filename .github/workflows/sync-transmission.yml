name: Sync Transmission Lines

on:
  schedule:
    - cron: '0 6 1 * *' # 1st of each month at 6am UTC (HIFLD updates irregularly)
  workflow_dispatch: {} # Manual trigger

permissions:
  contents: write
  pull-requests: write

# Data syncs commit to the same branch. Without serialisation two
# overlapping runs race on `git push` and the loser dies with
# non-fast-forward (CIR-1271). sync-annual and sync-pricing-nodes are
# both scheduled for Oct 1 12:00 UTC, so this is a real collision, not
# just a manual-dispatch artefact.
concurrency:
  group: data-sync-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync transmission lines from HIFLD
        run: npx tsx scripts/sync-transmission-lines.ts
      - name: Install tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j$(nproc) && sudo make install
      - name: Check tile build prerequisites
        # Surfaces optional-but-missing inputs in the log instead of letting a
        # layer vanish from the published tiles unnoticed (CIR-1271).
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::warning title=Substation tiles skipped::DATABASE_URL secret is not configured; substation tiles will not be rebuilt by this run."
          else
            echo "DATABASE_URL present — substation layer will be rebuilt."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Rebuild tiles
        env:
          # Used by prepare-substations-geojson.mjs, which reads substation
          # geometry from Neon. It is optional: when absent the substation layer
          # is skipped with a warning and the other layers still publish. The
          # secret is NOT currently configured on this repo, so substation tiles
          # are never refreshed by these syncs — see the warning emitted by the
          # "Check tile build prerequisites" step above (CIR-1271).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/build-tiles.sh
      - name: Publish via branch + PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: meridian/sync-transmission-lines-data
          PR_TITLE: "data: update transmission lines (HIFLD)"
          PR_BODY: |
            Automated transmission lines sync. The workflow commits generated data on a dedicated branch and opens or updates a pull request so branch protection can review and merge it safely.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/transmission-lines.json public/tiles/transmission-lines.pmtiles
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: update transmission lines (HIFLD)"
          git push --force-with-lease origin "$BRANCH"
          existing_pr_url="$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr_url" ]; then
            echo "Open PR already exists: $existing_pr_url"
            exit 0
          fi
          gh pr create --repo "$GH_REPO" --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
