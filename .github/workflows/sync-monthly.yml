name: Sync Monthly Data

on:
  schedule:
    - cron: '0 14 * * *' # Daily at 2pm UTC — check for new EIA-860M
  workflow_dispatch: {} # Manual trigger

permissions:
  contents: write
  pull-requests: write

# Data syncs open/refresh the same automation branch. Without serialisation two
# overlapping runs race on the branch push and the loser dies with
# non-fast-forward (CIR-1271). sync-annual and sync-pricing-nodes are
# both scheduled for Oct 1 12:00 UTC, so this is a real collision, not
# just a manual-dispatch artefact.
concurrency:
  group: data-sync-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Opt into the commongrid-data-sync GitHub Environment so DATABASE_URL
    # (an environment secret, not a repo secret) resolves at runtime. The
    # environment's deployment-branch policy restricts it to `main`, so
    # pull_request triggers can never read the credential (public-repo
    # exfiltration guard). Without this, the registry-publish step silently
    # skips with "DATABASE_URL is not set" (CG-263).
    environment: commongrid-data-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The registry (Postgres) is the source of truth: this step diffs EIA-860M
      # against current DB state and writes versioned changes through applySync,
      # so a Planned→Operable flip lands live and appears in the changelog. It
      # also writes data/power-plants.json, which the tile build below consumes.
      # DATABASE_URL is required for publication; without it the script warns and
      # still produces JSON + tiles (CIR-1271).
      - name: Sync EIA-860M → registry + JSON
        id: sync_monthly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          npx tsx scripts/sync-power-plants-monthly.ts | tee "$log_file"
          if grep -q "Already synced .* No update needed\." "$log_file"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip artifact refresh when monthly sync is a no-op
        if: steps.sync_monthly.outputs.changed != 'true'
        run: echo "Monthly sync made no data changes; skipping tile rebuild and artifact PR."
      - name: Install tippecanoe
        if: steps.sync_monthly.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j$(nproc) && sudo make install
      - name: Check tile build prerequisites
        if: steps.sync_monthly.outputs.changed == 'true'
        # Surfaces optional-but-missing inputs in the log instead of letting a
        # layer vanish from the published tiles unnoticed (CIR-1271).
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::warning title=Substation tiles skipped::DATABASE_URL secret is not configured; substation tiles will not be rebuilt by this run."
          else
            echo "DATABASE_URL present — substation layer will be rebuilt."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Rebuild tiles
        if: steps.sync_monthly.outputs.changed == 'true'
        env:
          # Used by prepare-substations-geojson.mjs, which reads substation
          # geometry from Neon. It is optional: when absent the substation layer
          # is skipped with a warning and the other layers still publish. The
          # secret is NOT currently configured on this repo, so substation tiles
          # are never refreshed by these syncs — see the warning emitted by the
          # "Check tile build prerequisites" step above (CIR-1271).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/build-tiles.sh
      # The live data has already landed in Postgres above. What remains are the
      # regenerated tile artifacts + the JSON base state the next run reads.
      # Those are versioned files, so they ship through a PR (branch protection
      # forbids pushing to main directly — the original cause of CG-262). The PR
      # is a build-artifact refresh, not the data-publication path.
      - name: Publish tile artifacts via branch + PR
        if: steps.sync_monthly.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: meridian/sync-monthly-artifacts
          PR_TITLE: "chore(data): refresh power-plant tiles + JSON (EIA-860M monthly)"
          PR_BODY: |
            Automated monthly artifact refresh. Live generator data was published
            to the registry (Postgres) by the sync job and is already reflected in
            the changelog; this PR only updates the regenerated tile archives and
            the `data/power-plants.json` base state the next run reads.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/power-plants.json public/tiles/*.pmtiles
          if git diff --staged --quiet; then
            echo "No artifact changes to publish."
            exit 0
          fi
          git commit -m "$PR_TITLE"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            remote_tip="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
            git push --force-with-lease=refs/heads/"$BRANCH":"$remote_tip" origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi
          existing_pr_url="$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr_url" ]; then
            echo "Open PR already exists: $existing_pr_url"
            exit 0
          fi
          gh pr create --repo "$GH_REPO" --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
