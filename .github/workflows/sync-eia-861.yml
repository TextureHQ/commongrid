name: Sync EIA-861 Demand Response

on:
  schedule:
    # EIA-861 is an annual release, but the final file and revisions trickle in
    # over the year. Re-check monthly (15th, noon UTC) so late revisions land;
    # applySync is idempotent, so an unchanged upstream file is a no-op run.
    - cron: '0 12 15 * *'
  workflow_dispatch: {} # Manual trigger

# Data syncs publish to a dedicated branch and open/update a PR instead of
# pushing directly to protected main. The shared concurrency group keeps the
# commit-and-publish phase serialized so scheduled runs do not race each other.
concurrency:
  group: data-sync-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Opt into the commongrid-data-sync GitHub Environment so DATABASE_URL
    # (an environment secret, not a repo secret) resolves at runtime. The
    # environment's deployment-branch policy restricts it to `main`, so
    # pull_request triggers can never read the credential (public-repo
    # exfiltration guard).
    environment: commongrid-data-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync EIA-861 demand response
        # Fetches the latest EIA-861 zip, parses the Demand Response workbook,
        # resolves each row to a utility, and applies utility-level DR metrics
        # through applySync (bulk diff, idempotent, policy-B human-sticky, batch
        # + per-entity changelog). DATABASE_URL-gated: absent, it parses and
        # reports resolution stats but writes nothing.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-eia-861.ts
      - name: Publish via branch + PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: talos/sync-eia-861-data
          PR_TITLE: "data: update EIA-861 demand response (annual sync)"
          PR_BODY: |
            Automated EIA-861 demand-response sync. The workflow commits the
            fetch manifest + last-sync marker on a dedicated branch and opens or
            updates a pull request so branch protection can review and merge it
            safely. The registry (utilities) and changelog are updated directly
            by applySync during the sync step above when DATABASE_URL is set.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # Only the fetch bookkeeping is committed to the repo; the entity data
          # lands in Postgres via applySync, not in a checked-in JSON file.
          git add data/eia-861/manifest.json data/.eia861-last-sync
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: update EIA-861 demand response (annual sync)"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$BRANCH:refs/remotes/origin/$BRANCH"
          fi
          git push --force-with-lease origin "$BRANCH"
          existing_pr_url="$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr_url" ]; then
            echo "Open PR already exists: $existing_pr_url"
            exit 0
          fi
          gh pr create --repo "$GH_REPO" --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
