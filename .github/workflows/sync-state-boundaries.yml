name: Sync State Boundaries

on:
  schedule:
    - cron: '0 12 5 * *' # 5th of each month at noon UTC
  workflow_dispatch: {} # Manual trigger

# Data syncs publish to a dedicated branch and open/update a PR instead of
# pushing directly to protected main. The shared concurrency group keeps the
# commit-and-publish phase serialized so scheduled runs do not race each other.
concurrency:
  group: data-sync-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Opt into the commongrid-data-sync GitHub Environment so DATABASE_URL
    # (an environment secret, not a repo secret) and FIRECRAWL_API_KEY resolve
    # at runtime. The environment's deployment-branch policy restricts it to
    # `main`, so pull_request triggers can never read the credentials
    # (public-repo exfiltration guard).
    environment: commongrid-data-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync state service-territory boundaries
        env:
          # Optional. Used by the adapter's fetch layer as a fallback when a
          # state source (e.g. the WI PSC server maps.psc.wi.gov) 403s bare
          # requests. When absent, the fallback is skipped and any bot-blocked
          # source surfaces its direct error in the run report rather than
          # silently dropping.
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: npx tsx scripts/sync-state-boundaries.ts
      - name: Generate changelog from data diffs
        # Diffs data/regions.json against the committed snapshot and appends
        # structured changelog entries (added / updated service territories)
        # instead of silently overwriting. Change-detection lives here so a
        # no-op sync produces an empty diff and no PR.
        run: npx tsx scripts/generate-changelog.ts
      - name: Publish via branch + PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: talos/sync-state-boundaries-data
          PR_TITLE: "data: update state service-territory boundaries"
          PR_BODY: |
            Automated state service-territory boundary sync (WI + MN direct, CO via HIFLD).

            The workflow runs the registry-driven adapter, regenerates the changelog
            from a diff against the committed snapshot, commits the changed data on a
            dedicated branch, and opens or updates a pull request so branch protection
            can review and merge it safely. If nothing changed since the last run, no
            commit is made and no PR is opened.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/regions.json data/changelog.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: update state service-territory boundaries"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$BRANCH:refs/remotes/origin/$BRANCH"
          fi
          git push --force-with-lease origin "$BRANCH"
          existing_pr_url="$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr_url" ]; then
            echo "Open PR already exists: $existing_pr_url"
            exit 0
          fi
          gh pr create --repo "$GH_REPO" --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
