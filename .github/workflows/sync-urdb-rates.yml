name: Sync URDB Rate Structures

on:
  schedule:
    - cron: '0 6 * * 0' # Sundays at 6:00 AM UTC
  workflow_dispatch: {} # Manual trigger

# Data syncs publish to a dedicated branch and open/update a PR instead of
# pushing directly to protected main. The shared concurrency group keeps the
# commit-and-publish phase serialized so scheduled runs do not race each other.
concurrency:
  group: data-sync-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Opt into the commongrid-data-sync GitHub Environment so DATABASE_URL
    # (an environment secret, not a repo secret) and NREL_API_KEY resolve
    # at runtime. The environment's deployment-branch policy restricts it to
    # `main`, so pull_request triggers can never read the credentials
    # (public-repo exfiltration guard).
    environment: commongrid-data-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync URDB rate structures
        env:
          # Used by applySync to publish rate_structures to the registry.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # NREL / data.gov API key for the OpenEI URDB feed.
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
          # Verify rate sourceUrl link health during ingest; disabled by default
          # so local/test runs do not make live network calls.
          URDB_CHECK_SOURCE_URLS: "true"
        run: npx tsx scripts/sync-urdb-rates.ts
      - name: Publish via branch + PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: talos/sync-urdb-rates-data
          PR_TITLE: "data: update URDB rate structures"
          PR_BODY: |
            Automated OpenEI URDB rate-structure sync. The workflow commits generated bookkeeping (the run manifest) on a dedicated branch and opens or updates a pull request so branch protection can review and merge it safely.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/urdb-rates/manifest.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: update URDB rate structures"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$BRANCH:refs/remotes/origin/$BRANCH"
          fi
          git push --force-with-lease origin "$BRANCH"
          existing_pr_url="$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr_url" ]; then
            echo "Open PR already exists: $existing_pr_url"
            exit 0
          fi
          gh pr create --repo "$GH_REPO" --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
