name: Sync Pricing Nodes Data

on:
  schedule:
    - cron: '0 12 1 * *' # 1st of each month at 12pm UTC
  workflow_dispatch: {} # Manual trigger

# Data syncs commit to the same branch. Without serialisation two
# overlapping runs race on `git push` and the loser dies with
# non-fast-forward (CIR-1271). sync-annual and sync-pricing-nodes are
# both scheduled for Oct 1 12:00 UTC, so this is a real collision, not
# just a manual-dispatch artefact.
concurrency:
  group: data-sync-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync pricing nodes
        run: npx tsx scripts/sync-pricing-nodes.ts
      # scripts/copy-pricing-nodes.mjs was deleted in af95fee when the list
      # pages moved to server-driven API hooks and public/data/pricing-nodes.json
      # stopped being served to the client. This workflow kept calling it and
      # died with MODULE_NOT_FOUND on every run since (CIR-1271). Pricing nodes
      # now reach the browser as vector tiles, so no copy step is needed.
      - name: Install tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j$(nproc) && sudo make install
      # No `Install pmtiles CLI` step here on purpose. It used to download
      # go-pmtiles_Linux_x86_64.tar.gz from /releases/latest/download/, but that
      # asset does not exist — go-pmtiles names its assets with the version in
      # them (go-pmtiles_1.31.2_Linux_x86_64.tar.gz), so the URL 404s. `curl -sL`
      # happily piped the 404 HTML into `tar -xz`, which died with "gzip: stdin:
      # not in gzip format" and failed this workflow on every single run since it
      # was added (CIR-1271). The CLI is only used by build-tiles.sh for
      # diagnostic `pmtiles show` output, which is guarded by `command -v`, so
      # the other four sync workflows build tiles fine without it.
      - name: Check tile build prerequisites
        # Surfaces optional-but-missing inputs in the log instead of letting a
        # layer vanish from the published tiles unnoticed (CIR-1271).
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::warning title=Substation tiles skipped::DATABASE_URL secret is not configured; substation tiles will not be rebuilt by this run."
          else
            echo "DATABASE_URL present — substation layer will be rebuilt."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Rebuild tiles
        env:
          # Used by prepare-substations-geojson.mjs, which reads substation
          # geometry from Neon. It is optional: when absent the substation layer
          # is skipped with a warning and the other layers still publish. The
          # secret is NOT currently configured on this repo, so substation tiles
          # are never refreshed by these syncs — see the warning emitted by the
          # "Check tile build prerequisites" step above (CIR-1271).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/build-tiles.sh
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pricing-nodes.json public/tiles/pricing-nodes.pmtiles
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: update pricing nodes (monthly sync)"
          # Retry around concurrent pushes to the same branch: rebase onto
          # whatever landed while this job was building tiles, then push again.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/$GITHUB_REF_NAME."
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          done
          echo "::error title=Sync push failed::Could not push after 3 rebase attempts."
          exit 1
