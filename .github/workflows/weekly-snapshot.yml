name: Weekly Database Snapshot

on:
  schedule:
    - cron: '0 4 * * 0' # Sunday 4:00 AM UTC
  workflow_dispatch: {} # Manual trigger

permissions:
  contents: write

env:
  SNAPSHOT_DIR: /tmp/commongrid-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Opt into the commongrid-data-sync GitHub Environment so DATABASE_URL
    # (an environment secret, not a repo secret) resolves at runtime. The
    # environment's deployment-branch policy restricts it to `main`, so
    # pull_request triggers can never read the credential (public-repo
    # exfiltration guard). Without this, the snapshot job aborts with
    # "DATABASE_URL secret is not set" (CG-263).
    environment: commongrid-data-sync
    steps:
      - uses: actions/checkout@v4

      # The Neon server is Postgres 17. pg_dump refuses to dump a server newer
      # than itself ("aborting because of server version mismatch"), and the
      # Ubuntu runner's default postgresql-client is v16 — which is exactly what
      # broke every snapshot run from 2026-08-16 onward (CIR-1272). Install the
      # v17 client from the official PGDG apt repo so client >= server.
      #
      # CRITICAL (CIR-1272 regression, 2026-09-20): installing postgresql-client-17
      # is NOT sufficient. Ubuntu ships `postgresql-client-common`, whose
      # `/usr/bin/pg_dump` is the Debian `pg_wrapper` shim. That shim dispatches
      # to the HIGHEST installed major only when no explicit cluster/version is
      # requested — but the runner already has v16 binaries, and the wrapper's
      # resolution left `pg_dump --version` reporting 16.15, so the Sunday runs
      # kept aborting with the same version mismatch even though v17 was present.
      # Prepend the versioned bindir (/usr/lib/postgresql/17/bin) to PATH so the
      # real v17 binaries win, and assert the resolved version is >= 17 before
      # doing anything, so a future silent regression fails loudly here.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Put the real v17 binaries ahead of the v16 wrapper for all later steps.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Assert pg client >= 17
        shell: bash -euo pipefail {0}
        run: |
          DUMP_BIN="$(command -v pg_dump)"
          echo "pg_dump resolved to: $DUMP_BIN"
          pg_dump --version
          MAJOR="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          if [ "$MAJOR" -lt 17 ]; then
            echo "::error::pg_dump major is ${MAJOR} (<17) — the v16 wrapper is still winning on PATH. Refusing to run against a v17 server."
            exit 1
          fi
          echo "pg_dump major ${MAJOR} OK (>=17)."

      - name: Set snapshot tag
        id: tag
        run: |
          YEAR=$(date -u +%Y)
          WEEK=$(date -u +%V)
          TAG="snapshot/${YEAR}-W${WEEK}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "year=${YEAR}" >> "$GITHUB_OUTPUT"
          echo "week=${WEEK}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Snapshot tag: ${TAG}"

      - name: Create snapshot directory
        run: mkdir -p "$SNAPSHOT_DIR"

      # Fail loudly and early if the DB credential is missing. Without this the
      # export steps below silently produced 20-byte (empty) gzip files that were
      # still published as public releases — see CIR-1271.
      - name: Verify DATABASE_URL is present
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set — refusing to publish an empty snapshot."
            exit 1
          fi
          echo "DATABASE_URL is present."

      # SQL dump is scoped to an explicit ALLOWLIST of public reference tables.
      # This is a PUBLIC release (ODbL) — a full `pg_dump` would leak users,
      # api_keys (credentials!), contributions, moderation_actions,
      # notifications, and other operational/PII tables. We enumerate exactly
      # the datasets that belong in the open dataset and dump only those with
      # `--table`. Anything not on this list is never exported (CIR-1273).
      #
      # To add a dataset to the public snapshot, add its table here explicitly.
      # Do NOT switch this to a full-database dump.
      - name: Export public reference tables (SQL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # `pipefail` is essential: without it, `pg_dump | gzip` reports the exit
        # status of gzip (0) even when pg_dump fails, which is how empty
        # snapshots got published for months.
        shell: bash -euo pipefail {0}
        run: |
          echo "Dumping public reference tables..."
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --format=plain \
            --table=public.balancing_authorities \
            --table=public.ev_stations \
            --table=public.isos \
            --table=public.power_plant_interconnections \
            --table=public.power_plants \
            --table=public.pricing_nodes \
            --table=public.programs \
            --table=public.regions \
            --table=public.rtos \
            --table=public.substations \
            --table=public.territories \
            --table=public.transmission_line_endpoints \
            --table=public.transmission_lines \
            --table=public.utilities \
            | gzip -9 > "$SNAPSHOT_DIR/commongrid-${{ steps.tag.outputs.date }}.sql.gz"
          echo "SQL dump size: $(du -h "$SNAPSHOT_DIR/commongrid-${{ steps.tag.outputs.date }}.sql.gz" | cut -f1)"

      - name: Export GeoJSON — Utilities
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash -euo pipefail {0}
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -t -A -c "
            SELECT json_build_object(
              'type', 'FeatureCollection',
              'features', COALESCE(json_agg(
                json_build_object(
                  'type', 'Feature',
                  'properties', json_build_object(
                    'id', u.id,
                    'name', u.name,
                    'slug', u.slug,
                    'eia_id', u.eia_id,
                    'segment', u.segment,
                    'state', r.state,
                    'customers', r.customers,
                    'region_id', r.id,
                    'source', u.source, 'source_url', u.source_url,
                    'geometry_source', t.source, 'geometry_source_url', t.source_url
                  ),
                  'geometry', ST_AsGeoJSON(t.geography::geometry)::json
                )
              ), '[]'::json)
            )
            FROM utilities u
            JOIN regions r ON u.service_territory_id = r.id
            JOIN territories t ON t.region_id = r.id AND t.deleted_at IS NULL
            WHERE u.deleted_at IS NULL AND r.deleted_at IS NULL
          " | gzip -9 > "$SNAPSHOT_DIR/utilities.geojson.gz"
          echo "Utilities GeoJSON size: $(du -h "$SNAPSHOT_DIR/utilities.geojson.gz" | cut -f1)"

      - name: Export GeoJSON — EV Stations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash -euo pipefail {0}
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -t -A -c "
            SELECT json_build_object(
              'type', 'FeatureCollection',
              'features', COALESCE(json_agg(
                json_build_object(
                  'type', 'Feature',
                  'properties', json_build_object(
                    'id', id,
                    'name', station_name,
                    'network', ev_network,
                    'connector_types', ev_connector_types,
                    'level2_count', ev_level2_evse_num,
                    'dcfast_count', ev_dc_fast_num,
                    'city', city,
                    'state', state,
                    'zip', zip,
                    'status', status_code,
                    'source', source, 'source_url', source_url
                  ),
                  'geometry', json_build_object(
                    'type', 'Point',
                    'coordinates', json_build_array(longitude, latitude)
                  )
                )
              ), '[]'::json)
            )
            FROM ev_stations
            WHERE deleted_at IS NULL
              AND longitude BETWEEN -180 AND 180 AND latitude BETWEEN -90 AND 90
          " | gzip -9 > "$SNAPSHOT_DIR/ev-stations.geojson.gz"
          echo "EV stations GeoJSON size: $(du -h "$SNAPSHOT_DIR/ev-stations.geojson.gz" | cut -f1)"

      - name: Export GeoJSON — Power Plants
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash -euo pipefail {0}
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -t -A -c "
            SELECT json_build_object(
              'type', 'FeatureCollection',
              'features', COALESCE(json_agg(
                json_build_object(
                  'type', 'Feature',
                  'properties', json_build_object(
                    'id', id,
                    'name', name,
                    'slug', slug,
                    'utility_id', utility_id,
                    'state', state,
                    'primary_fuel', primary_fuel,
                    'total_capacity_mw', total_capacity_mw,
                    'status', status,
                    'source', source, 'source_url', source_url
                  ),
                  'geometry', json_build_object(
                    'type', 'Point',
                    'coordinates', json_build_array(longitude, latitude)
                  )
                )
              ), '[]'::json)
            )
            FROM power_plants
            WHERE deleted_at IS NULL
              AND longitude BETWEEN -180 AND 180 AND latitude BETWEEN -90 AND 90
          " | gzip -9 > "$SNAPSHOT_DIR/power-plants.geojson.gz"
          echo "Power plants GeoJSON size: $(du -h "$SNAPSHOT_DIR/power-plants.geojson.gz" | cut -f1)"

      - name: Export GeoJSON — Pricing Nodes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash -euo pipefail {0}
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -t -A -c "
            SELECT json_build_object(
              'type', 'FeatureCollection',
              'features', COALESCE(json_agg(
                json_build_object(
                  'type', 'Feature',
                  'properties', json_build_object(
                    'id', id,
                    'name', name,
                    'slug', slug,
                    'iso', iso,
                    'node_type', node_type,
                    'zone', zone,
                    'state', state,
                    'source', source, 'source_url', source_url
                  ),
                  'geometry', json_build_object(
                    'type', 'Point',
                    'coordinates', json_build_array(longitude, latitude)
                  )
                )
              ), '[]'::json)
            )
            FROM pricing_nodes
            WHERE deleted_at IS NULL
              AND longitude BETWEEN -180 AND 180 AND latitude BETWEEN -90 AND 90
          " | gzip -9 > "$SNAPSHOT_DIR/pricing-nodes.geojson.gz"
          echo "Pricing nodes GeoJSON size: $(du -h "$SNAPSHOT_DIR/pricing-nodes.geojson.gz" | cut -f1)"

      # Programs is one of the most valuable datasets in CommonGrid — most of it
      # was gathered by hand. It has no geometry (programs reference regions by
      # id), so it ships as a standalone JSON array rather than GeoJSON, in
      # addition to being in the SQL dump above. This makes the crown-jewel
      # dataset downloadable without restoring the whole Postgres dump.
      - name: Export JSON — Programs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash -euo pipefail {0}
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -t -A -c "
            SELECT COALESCE(json_agg(row_to_json(p) ORDER BY p.name), '[]'::json)
            FROM (
              SELECT
                id, slug, name, description,
                organizations, asset_types, market_segments,
                participation_models, incentive_structures, grid_services,
                regions, compensation_tiers, capacity_target, max_enrollments,
                program_season, launched_at, enrollment_opens, enrollment_closes,
                ends_at, status, program_website, faq_url, terms_url, contact_url,
                variants, derms_vendor, device_types, other_notes,
                source, source_url
              FROM programs
              WHERE deleted_at IS NULL
            ) p
          " | gzip -9 > "$SNAPSHOT_DIR/programs.json.gz"
          echo "Programs JSON size: $(du -h "$SNAPSHOT_DIR/programs.json.gz" | cut -f1)"

      - name: Export remaining spatial layers and relational rates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/export-snapshot-layers.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate snapshot artifacts
        run: node scripts/validate-snapshot.mjs "$SNAPSHOT_DIR" | tee "$SNAPSHOT_DIR/COVERAGE.txt"

      # Defense-in-depth guard: the SQL dump should only contain the public
      # allowlist above. If a private table ever appears here, the workflow
      # must fail before publishing the release.
      - name: Validate SQL dump excludes private tables
        shell: bash -euo pipefail {0}
        run: |
          SQL_DUMP="$SNAPSHOT_DIR/commongrid-${{ steps.tag.outputs.date }}.sql.gz"
          BAD_TABLES='public\.(users|api_keys|notifications|user_notification_prefs|knock_delivery_log|contributions|contribution_appeals|moderation_actions|discussion_posts|api_usage_events|entity_locks|bulk_operations)'
          if gunzip -c "$SQL_DUMP" | grep -Eiq "$BAD_TABLES"; then
            echo "::error::SQL dump contains private tables that must not be published publicly."
            exit 1
          fi
          echo "SQL dump passed private-table guard."

      - name: Generate manifest
        run: |
          cd "$SNAPSHOT_DIR"
          echo "# CommonGrid Snapshot — ${{ steps.tag.outputs.date }} (W${{ steps.tag.outputs.week }})" > MANIFEST.md
          echo "" >> MANIFEST.md
          echo "## Geometry coverage" >> MANIFEST.md
          echo '' >> MANIFEST.md
          echo 'Transmission metadata can have null geometry. Counts below distinguish located records.' >> MANIFEST.md
          echo '```text' >> MANIFEST.md
          cat COVERAGE.txt >> MANIFEST.md
          echo '```' >> MANIFEST.md
          echo '' >> MANIFEST.md
          echo "## Files" >> MANIFEST.md
          echo "" >> MANIFEST.md
          for f in *.gz; do
            SIZE=$(du -h "$f" | cut -f1)
            echo "- \`$f\` — $SIZE" >> MANIFEST.md
          done
          echo "" >> MANIFEST.md
          echo "## License" >> MANIFEST.md
          echo "" >> MANIFEST.md
          echo "Released under [Open Database License 1.0](https://opendatacommons.org/licenses/odbl/)." >> MANIFEST.md
          echo "" >> MANIFEST.md
          echo "Generated automatically by [CommonGrid](https://commongrid.info) weekly snapshot workflow." >> MANIFEST.md
          cat "$GITHUB_WORKSPACE/docs/public-snapshot.md" >> MANIFEST.md
          cat MANIFEST.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DATE="${{ steps.tag.outputs.date }}"
          WEEK="${{ steps.tag.outputs.week }}"
          YEAR="${{ steps.tag.outputs.year }}"

          # Build release notes
          NOTES="## CommonGrid Weekly Snapshot

          **Date:** ${DATE} (Week ${WEEK}, ${YEAR})
          **License:** [ODbL 1.0](https://opendatacommons.org/licenses/odbl/)

          ### Contents

          | File | Description |
          |------|-------------|
          | \`commongrid-${DATE}.sql.gz\` | Full SQL dump of all public tables below (allowlisted \`pg_dump\`, gzipped) |
          | \`programs.json.gz\` | Demand-response & grid-services programs — hand-curated (JSON array) |
          | \`utilities.geojson.gz\` | Utilities with service-territory geometry |
          | \`ev-stations.geojson.gz\` | EV charging stations (point locations) |
          | \`power-plants.geojson.gz\` | Power plants (point locations) |
          | \`pricing-nodes.geojson.gz\` | ISO/RTO pricing nodes (point locations) |

          Additional exports: \`rates.json.gz\` (relational tariffs with utility/region IDs),
          \`transmission-lines.geojson.gz\`, \`substations.geojson.gz\`, \`territories.geojson.gz\`,
          \`balancing-authorities.geojson.gz\`, \`isos.geojson.gz\`, and \`rtos.geojson.gz\`.
          Geographic exports include only records with stored geometry or valid coordinates.
          Programs and rates do not imply eligibility throughout a utility boundary.
          See MANIFEST.md for coverage, provenance and attribution.

          ### Public tables in the SQL dump

          The \`.sql.gz\` dump contains these public tables (no user/PII/operational data):
          \`balancing_authorities\`, \`ev_stations\`, \`isos\`, \`power_plant_interconnections\`, \`power_plants\`, \`pricing_nodes\`, \`programs\`, \`regions\`, \`rtos\`, \`substations\`, \`territories\`, \`transmission_line_endpoints\`, \`transmission_lines\`, \`utilities\`.

          ### Usage

          \`\`\`bash
          # Restore the full SQL dump
          gunzip -c commongrid-${DATE}.sql.gz | psql your_database

          # Programs dataset as JSON (no restore needed)
          gunzip -c programs.json.gz | jq '.[0]'

          # Load GeoJSON into ogr2ogr / QGIS / tippecanoe
          gunzip utilities.geojson.gz
          ogr2ogr -f PostgreSQL PG:dbname=mydb utilities.geojson
          \`\`\`

          ---
          Generated automatically by CommonGrid. Browse the data at https://commongrid.info"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Weekly Snapshot — ${DATE}" \
              --notes "$NOTES"

            gh release upload "$TAG" \
              "$SNAPSHOT_DIR"/*.gz "$SNAPSHOT_DIR"/MANIFEST.md \
              --clobber
          else
            gh release create "$TAG" \
              --title "Weekly Snapshot — ${DATE}" \
              --notes "$NOTES" \
              "$SNAPSHOT_DIR"/*.gz "$SNAPSHOT_DIR"/MANIFEST.md
          fi
